<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#191a17"><title>Product Management</title><link rel="stylesheet" href="styles.css"></head><body><header class="topbar"><a class="brand" href="index.html"><span class="mark">BD</span><span><b data-store>B.D. Fashion Store</b><small>STYLE THAT SPEAKS</small></span></a><nav class="nav"><a href="index.html">Shop</a><a href="tracking.html">Track order</a><a href="admin.html">Admin</a></nav><div class="actions"><a class="btn light" href="account.html"><span data-user>Sign in</span></a><a class="btn dark" href="cart.html">Cart <span id="cartCount" class="count">0</span></a></div></header><main class="container"><div class="section"><div><span class="eyebrow">CATALOGUE</span><h1 style="font-size:42px">Products.</h1></div><a class="btn outline" href="admin.html">Dashboard</a></div><section class="panel"><h2 id="formTitle">Add a product</h2><form id="productForm" class="formgrid"><label class="field">Product name<input id="pName" required></label><label class="field">Category<select id="pCategory"><option>Men</option><option>Women</option><option>Kids</option><option>Accessories</option></select></label><label class="field">Price ₹<input id="pPrice" type="number" min="0" step=".01" required></label><label class="field">Opening stock<input id="pStock" type="number" min="0" step="1" required></label><label class="field">Image HTTPS URL<input id="pImage" type="url"></label><label class="field">Badge<input id="pBadge"></label><label class="field span2">Description<textarea id="pDescription"></textarea></label><div class="span2"><button id="saveBtn" class="btn dark">Save product</button> <button id="cancelEdit" type="button" class="btn outline hidden">Cancel</button><p id="formMessage" class="error"></p></div></form></section><section class="panel"><h2>All products</h2><div class="tablewrap"><table class="table"><thead><tr><th>Product</th><th>Category</th><th>Price</th><th>Stock</th><th>Visibility</th><th>Actions</th></tr></thead><tbody id="productsTable"></tbody></table></div></section></main><footer>© <span id="year">2026</span> B.D. Fashion Store · Fashion for every day</footer><div id="toast" class="toast"></div><script type="module" src="site.js"></script></body></html>
