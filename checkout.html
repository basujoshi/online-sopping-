<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#191a17"><title>Checkout</title><link rel="stylesheet" href="styles.css"></head><body><header class="topbar"><a class="brand" href="index.html"><span class="mark">BD</span><span><b data-store>B.D. Fashion Store</b><small>STYLE THAT SPEAKS</small></span></a><nav class="nav"><a href="index.html">Shop</a><a href="tracking.html">Track order</a><a href="admin.html">Admin</a></nav><div class="actions"><a class="btn light" href="account.html"><span data-user>Sign in</span></a><a class="btn dark" href="cart.html">Cart <span id="cartCount" class="count">0</span></a></div></header><main class="container"><span class="eyebrow">SECURE CHECKOUT</span><h1 style="font-size:44px">Checkout.</h1><p id="signedInAs" class="muted"></p><div style="display:grid;grid-template-columns:minmax(0,1.5fr) minmax(250px,1fr);gap:20px"><form id="checkoutForm" class="panel"><h2>Delivery details</h2><div class="formgrid"><label class="field">Full name<input id="customerName" required maxlength="80" autocomplete="name"></label><label class="field">Mobile number<input id="phone" type="tel" required minlength="10" maxlength="15" autocomplete="tel" inputmode="tel"></label><label class="field span2">Email<input id="customerEmail" type="email" readonly></label><label class="field span2">House / Flat / Building<input id="house" required maxlength="120" autocomplete="address-line1"></label><label class="field span2">Street / Area / Village<input id="area" required maxlength="160" autocomplete="address-line2"></label><label class="field">City / District<input id="city" required maxlength="80" autocomplete="address-level2"></label><label class="field">State<input id="state" required maxlength="80" autocomplete="address-level1"></label><label class="field">PIN Code<input id="pincode" type="text" inputmode="numeric" pattern="[0-9]{6}" minlength="6" maxlength="6" required autocomplete="postal-code"></label><label class="field">Landmark (optional)<input id="landmark" maxlength="120"></label><label class="field span2">Delivery instructions (optional)<textarea id="note" maxlength="200" rows="2" placeholder="Any helpful delivery note"></textarea></label><label class="field">Payment<select id="paymentMethod"><option value="COD">Cash on Delivery</option><option value="UPI">UPI payment</option></select></label></div><div id="upiInfo" class="notice hidden">UPI app will open after order. Payment must be verified by store admin.</div><p id="checkoutError" class="error"></p><button id="placeOrder" class="btn dark">Place order →</button></form><aside class="panel"><h2>Summary</h2><div id="summaryItems"></div><div class="line"><span>Subtotal</span><b id="subtotal">₹0</b></div><div class="line"><span>Shipping</span><b id="shipping">₹0</b></div><div class="line"><span>Total</span><b id="total">₹0</b></div></aside></div></main><footer>© <span id="year">2026</span> B.D. Fashion Store · Fashion for every day</footer><div id="toast" class="toast"></div><script type="module" src="site.js"></script></body></html>
